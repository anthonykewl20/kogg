name: Kogg foundation

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-dev libx11-dev libxkbfile-dev pkg-config rpm xvfb
      - name: Install Windows native build prerequisites
        if: runner.os == 'Windows'
        run: choco install sqlite --version 3.53.4 -y --no-progress
      - run: volta install node@22.23.2 yarn@1.22.22
      - run: uv python install 3.12.14
      - run: yarn setup
      - name: Governed task boundary prototype
        if: runner.os != 'Windows'
        env:
          KOGG_PROBE_PYTHON: .venv/bin/python
        run: node prototypes/tasks-boundary/probe.mjs
      - run: yarn test
      - run: yarn build:browser
      - run: yarn test:e2e:browser
      - run: yarn build:electron
      - name: Electron E2E (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            mkdir -p "$HOME/.local/share/keyrings"
            chmod 700 "$HOME/.local/share/keyrings"
            eval "$(printf %s kogg-ci-keyring | gnome-keyring-daemon --unlock --components=secrets)"
            gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.DBus.Peer.Ping
            yarn test:e2e:electron
          '
      - name: Electron E2E (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: yarn test:e2e:electron
      - run: yarn package:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KOGG_REGISTRY_URL: https://registry.invalid/ci-only
      - name: Packaged application smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a yarn test:e2e:artifact
      - name: Packaged application smoke (macOS and Windows)
        if: runner.os != 'Linux'
        run: yarn test:e2e:artifact
