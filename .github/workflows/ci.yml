name: Kogg foundation

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libx11-dev libxkbfile-dev pkg-config rpm
      - run: volta install node@22.23.2 yarn@1.22.22
      - run: uv python install 3.12.14
      - run: yarn setup
      - run: yarn test
      - run: yarn build:browser
      - run: yarn build:electron
      - run: yarn package:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KOGG_REGISTRY_URL: https://registry.invalid/ci-only
