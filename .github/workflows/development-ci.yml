name: 'Development CI'

on:
  push:
    branches:
      - 'development'
  pull_request:
    branches:
      - 'development'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

env:
  NODE_OPTIONS: '--max-old-space-size=3072'
  QWEN_SKIP_PREPARE: '1'

jobs:
  quality:
    name: 'Quality (Node 22)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 'Validate workflow contract'
        run: 'node --test .github/scripts/ci/development-ci.test.mjs'

      - name: 'Install dependencies'
        run: 'npm ci --prefer-offline --no-audit --progress=false'

      - name: 'Check lockfile'
        run: 'npm run check:lockfile'

      - name: 'Lint'
        run: 'npm run lint:ci'

      - name: 'Build core and terminal client'
        run: 'npm run build -- --cli-only'

      - name: 'Typecheck core and terminal client'
        run: 'npm run typecheck --workspace=@qwen-code/qwen-code-core --workspace=@qwen-code/qwen-code'

      - name: 'Test core and terminal client'
        env:
          NO_COLOR: 'true'
          HOME: '${{ runner.temp }}/kogg-ci-home'
          USERPROFILE: '${{ runner.temp }}/kogg-ci-home'
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GOOGLE_API_KEY: ''
          DASHSCOPE_API_KEY: ''
          QWEN_API_KEY: ''
          GEMINI_API_KEY: ''
          QWEN_DEFAULT_AUTH_TYPE: ''
        run: |-
          mkdir -p "${HOME}"
          npm run test:ci --workspace=@qwen-code/qwen-code-core --workspace=@qwen-code/qwen-code -- --coverage.enabled=false

      - name: 'Test scripts and workflow contracts'
        env:
          NO_COLOR: 'true'
          HOME: '${{ runner.temp }}/kogg-ci-home'
          USERPROFILE: '${{ runner.temp }}/kogg-ci-home'
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GOOGLE_API_KEY: ''
          DASHSCOPE_API_KEY: ''
          QWEN_API_KEY: ''
          GEMINI_API_KEY: ''
          QWEN_DEFAULT_AUTH_TYPE: ''
        run: 'npm run test:scripts'
